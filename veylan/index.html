  <div id="app" class="vy-ui vy-verre mode-explore">
    <header id="topbar">
      <div id="brand"><img src="assets/ui/logo-veylan.webp" alt="Veylan" width="74" height="30"></div>
      <div id="timeline"></div>
      <div id="challenge" class="hidden"></div>
      <div id="round"></div>
    </header>

    <main id="stage">
      <canvas id="board"></canvas>
      <div id="banner" class="hidden"></div>
      <div id="explore-hud">
        <div id="player-bar"></div>
        <div id="map-name"></div>
        <div id="carte-info" class="vy-carte-info"></div>
        <div id="tracker"></div>
        <div id="bas-centre"><div id="vital" class="vy-vital"></div><div id="raccourcis" class="vy-raccourcis" aria-label="Raccourcis d'objets"></div></div>
        <div id="lieu" class="vy-lieu" role="status"></div>
        <button id="minicarte" class="vy-minicarte" aria-label="Ouvrir la carte"><canvas id="minicarte-cv"></canvas><span id="minicarte-nom"></span></button>
      </div>
      <nav id="menus" class="vy-menus" aria-label="Menus"></nav>
      <div id="vue" class="vy-camera" role="group" aria-label="Vue"></div>
      <div id="toasts"></div>
    </main>

    <aside id="panneau" class="vy-panneau" aria-label="Panneau de jeu"></aside>

    <aside id="side">
      <section id="inspect"></section>
      <section id="log"></section>
    </aside>

    <footer id="hud">
      <div id="stats"></div>
      <div id="spells"></div>
      <div id="actions">
        <button id="ready" class="vy-bouton vy-bouton--primaire">Prêt</button>
        <button id="end-turn" class="vy-bouton vy-bouton--primaire hidden">Fin de tour</button>
      </div>
    </footer>

    <div id="fenetres" class="vy-fenetres"></div>
    <div id="panel" class="hidden">
      <section id="panel-box" class="vy-modale" role="dialog" aria-modal="true" aria-labelledby="panel-title">
        <header class="vy-modale__tete"><h2 id="panel-title" class="vy-modale__titre"></h2><button id="panel-close" class="vy-bouton vy-bouton--icone vy-bouton--fantome" aria-label="Fermer">×</button></header>
        <div id="panel-body" class="vy-modale__corps"></div>
      </section>
    </div>
    <div id="title" class="vy-ui hidden"></div>
  </div>
  <div id="tooltip" class="vy-ui hidden"></div>
