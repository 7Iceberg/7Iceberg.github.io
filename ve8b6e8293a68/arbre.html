<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0a10">
  <title>Veylan, Arbre des Sceaux</title>
  <link rel="stylesheet" href="css/polices.css">
  <style>
    /* Le banc d'essai de l'Arbre des Sceaux (docs/SCEAUX.md) : l'interface du jeu, seule, sur un fond
       sombre. Paramètres : ?niveau=100 (le niveau, 1 à 300), ?dragmes=60000, ?page=arbre, ?reset=1. */
    :root { color-scheme: dark; --fond-page: #0b0a10; }
    html, body { height: 100%; margin: 0; background: var(--fond-page); }
    body { background: radial-gradient(ellipse at 30% 20%, #1d1530 0%, transparent 55%), radial-gradient(ellipse at 80% 90%, #2a1420 0%, transparent 50%), var(--fond-page); }
    .banc-note { position: fixed; left: 50%; bottom: 8px; transform: translateX(-50%); font: 500 11px "Poppins", system-ui, sans-serif; color: rgba(243, 240, 248, 0.42); white-space: nowrap; z-index: 1; }
    .banc-note a { color: rgba(243, 240, 248, 0.68); }
    .banc-note button { font: inherit; color: rgba(243, 240, 248, 0.78); background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 6px; padding: 2px 8px; cursor: pointer; margin: 0 6px; }
    .banc-note button:hover { color: #fff; border-color: rgba(255, 255, 255, 0.3); }
    @media (max-width: 1000px), (max-height: 600px) { .banc-note { display: none; } }
  </style>
</head>
<body>
  <p class="banc-note">Banc d'essai : clic sur le niveau pour en gagner un (Maj : en perdre un). <button type="button" id="bancExemple">Reprendre l'exemple</button> <a href="index.html">Retour au jeu</a></p>
  <script src="js/son.js"></script>
  <script src="js/sceaux-data.js"></script>
  <script src="js/sceaux.js"></script>
  <script src="js/arbre-icones.js"></script>
  <script src="js/arbre.js"></script>
  <script>
    (() => {
      const CLE = 'veylan.sceaux.banc';
      const q = new URLSearchParams(location.search);
      const lire = () => { try { return JSON.parse(localStorage.getItem(CLE) || 'null'); } catch (e) { return null; } };
      const ecrire = (e) => { try { localStorage.setItem(CLE, JSON.stringify(e)); } catch (err) { /* stockage indisponible : l'essai continue sans */ } };
      let brut = q.get('reset') ? null : lire();
      // Sans sauvegarde : un Veilleur d'exemple au niveau 100, des points dans les quatre voies et
      // quelques Sceaux déjà posés, pour voir l'arbre vivant dès l'ouverture.
      const exemple = !brut;
      if (!brut) brut = { niveau: 100, dragmes: 60000 };
      if (q.get('niveau')) brut.niveau = Number(q.get('niveau'));
      if (q.get('dragmes')) brut.dragmes = Number(q.get('dragmes'));
      const etat = Sceaux.valider(brut);
      if (exemple) {
        for (const [v, n] of [['terre', 140], ['feu', 110], ['eau', 60], ['air', 40]]) Sceaux.ajouterPoints(etat, v, n);
        for (const id of ['terre_t1', 'terre_t2', 'terre_d1', 'terre_d1', 'terre_d1', 'terre_d2', 'terre_d3', 'terre_d3', 'terre_d4', 'terre_g1',
          'feu_t1', 'feu_g1', 'feu_g1', 'feu_g1', 'feu_g2', 'feu_g3', 'feu_d1', 'eau_t1', 'eau_t2', 'eau_g1', 'air_d1', 'air_d2']) Sceaux.poser(etat, id);
      }
      ecrire(etat);
      ArbreSceaux.ouvrir({ etat, page: q.get('page') || 'apercu', jeu: false, joueur: { titre: 'Banc d\'essai' }, surChangement: ecrire });
      // Reprendre l'exemple : l'état gardé est oublié, la page repart du Veilleur d'exemple.
      document.getElementById('bancExemple').onclick = () => { try { localStorage.removeItem(CLE); } catch (e) { /* rien */ } location.reload(); };
    })();
  </script>
</body>
</html>
